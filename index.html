<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Спортивный агент</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

</head>


<body>


<div class="container">


<h1>
🏆 Спортивный агент
</h1>


<p class="subtitle">
AI-подбор вида спорта<br>
для вашего ребенка
</p>


<div id="app">

<button onclick="startTest()">
Начать подбор спорта
</button>

</div>


</div>



<script>

if (window.vkBridge) {

    vkBridge.send("VKWebAppInit")
        .then(() => {

            console.log("VK Mini App initialized");

        })
        .catch((error) => {

            console.log("VK Bridge error:", error);

        });

}

</script>


<script src="app.js"></script>


</body>

</html>
